openapi: 3.1.0
info:
  title: Lightning Reporting APIs
  version: 3.8.3
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Read-only reporting interfaces for approved AI service accounts and individual
    Supabase Auth members. Read AGENTS.md and the authenticated catalog before querying.
servers:
  - url: https://aaqquwhdglueqlnbifvn.supabase.co/functions/v1
paths:
  /agent-reporting:
    get:
      operationId: runAgentReportingQuery
      summary: Query an approved table/report with a scoped agent key.
      description: >-
        Explicit report requests use strict validation and pagination. A request that
        omits report is a legacy settlement_summary request, authorized as
        settlement_summary, with the unchanged successful {count,data} response shape.
        Current/now/today trucks on road or working use the primary most-current
        credential-free live source https://lightningtransport.ninoxdb.com/share/eno5u22ebn2qdn215dpzwn02squ5wsixob8f?locale=en&utcoffset=-240
        immediately before answering, not driver_pay or a new MCP/gateway report.
        Validate all seven keys (truck_number, dispatcher, insurance, owner,
        Samsara_Truck_ID, Status, Ninox_ID), exact Status=On The Road Working,
        numeric positive integral IDs and string descriptions; count distinct truck_number.
        Reject redirects, non-2xx/non-JSON, duplicate keys, invalid/schema-drift rows
        or partial bodies within 30 seconds overall and 2 MiB. Exact source owner,
        dispatcher and insurance; no shared_owner expansion. State fetch-start/completion
        timestamps and row/distinct/full-validation evidence; upstream-sync time is unknown.
        Failures mean unknown/null, not zero; a validated empty array means zero in that snapshot.
        No cache/DriverPay fallback, GPS movement claim or fleet/off-duty complement.
        Historical or explicit-date assignment overlap ONLY uses driver_pay on_road_at=D: Out Date <= D
        and Return Date > D; paginate and count distinct nonblank Truck_Number.
        Null returns and return day are excluded. For now use America/New_York date.
        Current trucks in the yard, off duty, not working or not on the road use
        the approved external source in catalog guidance.off_duty_trucks:
        https://lightningtransport.ninoxdb.com/share/jx7z6tkjcnxalvsui4icdnqjuszia04etdhi?locale=en&utcoffset=-240
        Download and validate the entire live JSON immediately before answering,
        without forwarding gateway credentials. Every listed truck is off duty,
        including Ready To Go and Outside/vendor locations. Count distinct truck_number;
        generic yard wording does not restrict physical location. Failure is not zero,
        and absence is not proof of on-road status. This is external-source routing,
        not a new report enum or historical occupancy endpoint.
        Returning-trucks questions require complete driver_pay and returns requests for
        the same Return Date range. Exclude DriverPay Termination=Driver Changed and
        Transfer=Transfer To Other Truck, calculate floor(tc / 2 + ts), then union
        distinct qualifying Truck_Number with distinct returns.Truck. Road/outside/
        not-company-shop repairs use outside_repairs, not internal-shop LTR Invoices.
        Outside repair costs are attributed wholly by Choice (Truck or Trailer);
        truckless rows remain in overall totals, not truck/owner breakdowns.
        Outside repairs require truck, trailer, date_from, or ninox_id as an
        anchor; date_from/date_to filter inclusive service Date, not created_at.
        Departure totals require departures (DriverPay plus live Schedule_Teams)
        with the same Out Date window, deduplicated truck sets, never raw source
        addition or assignment-row counts. out_schedule is the planned list only.
        Source failure retains incomplete status and a null combined distinct total.
        The schema here specifies intended behavior; use authenticated catalog
        and metadata to confirm availability in the deployed function.
      security:
        - agentKey: []
      parameters:
        - name: report
          in: query
          schema:
            type: string
            enum: [catalog, settlement_summary, settlements, driver_pay, drivers, returns, trucks, fuel, outside_repairs, out_schedule, departures]
          description: Required for the strict contract. Use catalog for discovery.
        - name: compact
          in: query
          schema: {type: boolean, default: false}
          description: Catalog only. true returns permitted report routing/filter summaries and full global guidance, omitting report field dictionaries/calculation detail. Load report metadata before unfamiliar analysis. false or omitted preserves the full catalog.
        - name: metadata
          in: query
          schema: {type: boolean}
          description: With a data report, return its schema/rules. No other parameters are allowed.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - name: include_sensitive
          in: query
          schema: {type: boolean, default: false}
          description: All approved AGENT_API_KEY principals can request the explicit sensitive-field allowlist by default; a matching AGENT_ALLOW_SENSITIVE control set to false restricts a specific key.
        - name: truck
          in: query
          schema: {type: string}
          description: Exact text identifier in settlements; numeric identifier in returns or outside_repairs. Only in settlements, 1/2/3 identify documented non-physical owner-expense allocation buckets. Outside repair truck filters refer to recorded Truck, but Choice determines cost attribution.
        - name: trailer
          in: query
          schema: {type: string}
          description: Exact outside_repairs Trailer identifier; an eligible query anchor.
        - name: date_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive lower bound on outside_repairs service Date; an eligible query anchor.
        - name: date_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive upper bound on outside_repairs service Date; date_to alone is not an anchor.
        - name: truck_number
          in: query
          schema: {type: string}
          description: Exact DriverPay truck, or numeric current-trucks/fuel lookup according to report metadata.
        - name: driver_id
          in: query
          schema: {type: string}
        - name: owner
          in: query
          schema: {type: string}
          description: Exact owner filter. For outside_repairs match stored owner only and exclude truckless records from truck/owner breakdowns, not overall totals. For returns, match the returns row Owner (no shared_owner/current-trucks fallback). For settlements, settlement_summary, and fuel, match either primary owner or shared_owner; preserve both values.
        - name: dispatch
          in: query
          schema: {type: string}
        - name: dispatcher
          in: query
          schema: {type: string}
          description: Exact dispatcher filter. For returns, match the returns row Dispatcher; for trucks, match current dispatcher. Do not use current trucks for return-period attribution.
        - name: insurance
          in: query
          schema: {type: string}
        - name: to_report
          in: query
          schema: {type: string}
          description: Exact stored value; never use alone to infer the current settlement cycle.
        - name: period_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive lower bound on settlement From date.
        - name: period_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive upper bound on settlement From date.
        - name: on_road_at
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Historical or explicit-date DriverPay assignment overlap only, not current operational working status; date D; an eligible anchor. Filters Out Date <= D and Return Date > D. Cannot combine with other date filters or return_null; count distinct nonblank Truck_Number across all pages.
        - name: out_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Out Date lower bound. For out_schedule/departures optional but paired with out_to; maximum 31 inclusive days. Omit both for current Monday–Sunday in America/New_York.
        - name: out_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Out Date upper bound; paired with out_from for out_schedule/departures. Return-date filters and return exclusions/formula do not apply to these reports.
        - name: return_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Return Date lower bound on driver_pay and returns; use the same frame for both when counting returning trucks.
        - name: return_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Return Date upper bound on driver_pay and returns.
        - name: return_null
          in: query
          schema: {type: boolean}
          description: When true on driver_pay, keep only rows with Return Date null and Out Date present (open assignment). Cannot combine with return_from or return_to.
        - name: transfer
          in: query
          schema: {type: string}
        - name: termination
          in: query
          schema: {type: string}
        - name: solo
          in: query
          schema: {type: boolean}
        - name: temporal_driver
          in: query
          schema: {type: string, enum: [Yes, No]}
        - name: name
          in: query
          schema: {type: string}
        - name: first_name
          in: query
          schema: {type: string}
        - name: last_name
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
        - name: company
          in: query
          schema: {type: string}
          description: On outside_repairs, exact Repair Company text.
        - name: choice
          in: query
          schema: {type: string, enum: [Truck, Trailer]}
          description: Outside repairs only; full cost belongs to the chosen vehicle type, not both.
        - name: type_of_work
          in: query
          schema: {type: string, maxLength: 100, pattern: '^[^,]+$'}
          description: Outside repairs only; one complete category, case-insensitive membership in comma-separated Type of Work (trim surrounding spaces). Category totals may overlap.
        - name: ahs
          in: query
          schema: {type: string, enum: [Yes, No]}
          description: Outside repairs only; Yes is after-hours, No includes blank/null stored AHS.
        - name: exceptions
          in: query
          schema: {type: string}
          description: Exact stored outside-repair Exceptions text.
        - name: min_experience
          in: query
          schema: {type: number}
        - name: max_experience
          in: query
          schema: {type: number}
        - name: hire_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Date of Hire lower bound for drivers.
        - name: hire_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
          description: Inclusive Date of Hire upper bound for drivers.
        - name: ninox_id
          in: query
          schema: {type: number}
          description: Exact numeric source-record ID for returns, trucks, fuel, or outside_repairs; it is not a driver ID.
        - name: driver_name
          in: query
          schema: {type: string}
        - name: yard_location
          in: query
          schema: {type: string}
        - name: mechanic_status
          in: query
          schema: {type: string}
        - name: make
          in: query
          schema: {type: string}
        - name: min_odometer
          in: query
          schema: {type: number}
        - name: max_odometer
          in: query
          schema: {type: number}
        - name: min_model_year
          in: query
          schema: {type: number}
        - name: max_model_year
          in: query
          schema: {type: number}
        - name: store_from
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
        - name: store_to
          in: query
          schema: {$ref: '#/components/schemas/IsoDate'}
        - name: product
          in: query
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}

      responses:
        '200':
          description: Catalog, metadata, explicit paginated data, or legacy data response.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/DepartureDataResponse'}
                  - {$ref: '#/components/schemas/AgentDataResponse'}
                  - {$ref: '#/components/schemas/LegacyResponse'}
                  - {$ref: '#/components/schemas/CatalogResponse'}
                  - {$ref: '#/components/schemas/MetadataResponse'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {description: Only GET is allowed.}
        '416':
          description: Requested offset is beyond the available result range.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {description: "Sanitized audit, exact-count, or upstream reporting failure."}
        '503':
          description: "Structured incomplete out_schedule/departures evidence; never a complete or zero combined total."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartureDataResponse'}
  /reporting-query:
    post:
      operationId: runMemberReportingQuery
      summary: Run a membership/role-scoped report with a personal Supabase JWT.
      description: Individual onboarding is currently paused; do not use shared credentials.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [report]
              properties:
                report:
                  type: string
                  enum: [fleet_status, current_returns, driver_assignments, settlement_summary]
                filters:
                  type: object
                  additionalProperties: true
      responses:
        '200': {description: Role-authorized report result.}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    agentKey:
      type: apiKey
      in: header
      name: x-agent-key
      description: Assigned agent secret. Never send in the URL or expose to a browser.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IsoDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    OutsideRepairsRecord:
      type: object
      description: >-
        One public.Outside_Repairs row. All 14 physical fields are projected;
        nullability was verified against the live table. Total Cost includes parts
        and labor; Choice decides full Truck or Trailer cost attribution.
      required: [id, created_at, Status, Truck, Trailer, Date, Repair Company, Choice, Type of Work, Total Cost, AHS, owner, Ninox_ID, Exceptions]
      properties:
        id: {type: integer, description: "Non-null bigint row identity."}
        created_at: {type: string, format: date-time, description: "Non-null timestamptz row creation, not service Date."}
        Status: {type: [string, 'null']}
        Truck: {type: [number, 'null']}
        Trailer: {type: [string, 'null']}
        Date: {type: [string, 'null'], format: date, description: "Service date."}
        'Repair Company': {type: [string, 'null']}
        Choice: {type: [string, 'null'], description: "Truck attributes full cost to Truck; Trailer attributes full cost to Trailer."}
        'Type of Work': {type: [string, 'null'], description: "Comma-separated categories; memberships and category totals may overlap."}
        'Total Cost': {type: [number, 'null'], description: "Parts plus labor, already totaled."}
        AHS: {type: [string, 'null'], description: "Blank/null interpreted as No."}
        owner: {type: [string, 'null'], description: "Stored repair owner; no shared_owner expansion."}
        Ninox_ID: {type: [number, 'null']}
        Exceptions: {type: [string, 'null']}
    DeparturePeriod:
      type: object
      additionalProperties: false
      required: [out_from, out_to, time_zone]
      properties:
        out_from: {$ref: '#/components/schemas/IsoDate'}
        out_to: {$ref: '#/components/schemas/IsoDate'}
        time_zone: {type: string, const: America/New_York}
    DepartureReconciliation:
      type: object
      additionalProperties: false
      required: [driver_pay_count, schedule_teams_count, driver_pay_only_count, schedule_teams_only_count, overlap_count, combined_distinct_total]
      properties:
        driver_pay_count: {type: [integer, 'null'], minimum: 0}
        schedule_teams_count: {type: [integer, 'null'], minimum: 0}
        driver_pay_only_count: {type: [integer, 'null'], minimum: 0}
        schedule_teams_only_count: {type: [integer, 'null'], minimum: 0}
        overlap_count: {type: [integer, 'null'], minimum: 0}
        combined_distinct_total: {type: [integer, 'null'], minimum: 0, description: "Distinct normalized truck union; null on either source failure, never source-count addition or assignment-row count."}
    DepartureTruckSets:
      type: object
      additionalProperties: false
      required: [driver_pay, schedule_teams, driver_pay_only, schedule_teams_only, overlap, combined]
      properties:
        driver_pay: {$ref: '#/components/schemas/NullableTruckSet'}
        schedule_teams: {$ref: '#/components/schemas/NullableTruckSet'}
        driver_pay_only: {$ref: '#/components/schemas/NullableTruckSet'}
        schedule_teams_only: {$ref: '#/components/schemas/NullableTruckSet'}
        overlap: {$ref: '#/components/schemas/NullableTruckSet'}
        combined: {$ref: '#/components/schemas/NullableTruckSet'}
    NullableTruckSet:
      type: [array, 'null']
      uniqueItems: true
      items: {type: string, minLength: 1}
    ScheduleRecord:
      type: object
      additionalProperties: false
      description: "Allowlisted planned row; missing fields are omitted. Published team/driver labels require sensitive opt-in; internal driver IDs are never exposed. Duplicates can exist; rows are not truck totals."
      properties:
        Truck: {type: [number, string, 'null']}
        'Out Date': {type: [string, 'null'], format: date}
        Owner: {type: [string, 'null']}
        Dispatch: {type: [string, 'null']}
        Flatbed: {type: [string, boolean, 'null']}
        solo: {type: [number, string, boolean, 'null']}
        Team: {type: [string, 'null']}
        'Driver 1': {type: [string, 'null']}
        'Driver 2': {type: [string, 'null']}
    DepartureDataResponse:
      type: object
      required: [schema_version, report, source, filters, offset, limit, count, page_count, total_count, has_more, next_offset, as_of, data, request_id, period, status, complete]
      properties:
        schema_version: {type: string, const: 3.8.3}
        report: {type: string, enum: [out_schedule, departures]}
        source: {type: string}
        filters: {type: object, additionalProperties: {type: string}}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 1000}
        count: {type: integer, minimum: 0, description: "Alias for page_count; not the departure total."}
        page_count: {type: integer, minimum: 0}
        total_count: {type: [integer, 'null'], minimum: 0, description: "Envelope data rows, not distinct departing trucks; null for failed out_schedule fetch."}
        has_more: {type: boolean}
        next_offset: {type: [integer, 'null']}
        as_of: {type: string, format: date-time}
        request_id: {type: string, format: uuid}
        period: {$ref: '#/components/schemas/DeparturePeriod'}
        status: {type: string, enum: [complete, incomplete]}
        complete: {type: boolean, description: "Whole-source calculation completeness, independent of pagination."}
        reconciliation: {$ref: '#/components/schemas/DepartureReconciliation'}
        truck_sets: {$ref: '#/components/schemas/DepartureTruckSets'}
        source_status: {type: object, additionalProperties: true}
        data: {type: array, items: {type: object}}
      allOf:
        - if:
            properties: {report: {const: departures}}
          then:
            required: [reconciliation, truck_sets, source_status]
            properties:
              total_count: {type: integer, const: 1}
              count: {type: integer, minimum: 0, maximum: 1}
              page_count: {type: integer, minimum: 0, maximum: 1}
              data: {type: array, maxItems: 1}
        - if:
            properties: {report: {const: out_schedule}}
          then:
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ScheduleRecord'}}
        - if:
            properties: {complete: {const: false}}
          then:
            properties:
              status: {const: incomplete}
              reconciliation:
                properties:
                  combined_distinct_total: {type: 'null'}
                  overlap_count: {type: 'null'}
                  driver_pay_only_count: {type: 'null'}
                  schedule_teams_only_count: {type: 'null'}
              truck_sets:
                properties:
                  combined: {type: 'null'}
                  overlap: {type: 'null'}
                  driver_pay_only: {type: 'null'}
                  schedule_teams_only: {type: 'null'}
          else:
            properties:
              status: {const: complete}
              reconciliation:
                properties:
                  driver_pay_count: {type: integer}
                  schedule_teams_count: {type: integer}
                  driver_pay_only_count: {type: integer}
                  schedule_teams_only_count: {type: integer}
                  overlap_count: {type: integer}
                  combined_distinct_total: {type: integer}
              truck_sets:
                properties:
                  driver_pay: {type: array}
                  schedule_teams: {type: array}
                  driver_pay_only: {type: array}
                  schedule_teams_only: {type: array}
                  overlap: {type: array}
                  combined: {type: array}
    AgentDataResponse:
      type: object
      required: [schema_version, report, source, filters, offset, limit, count, page_count, total_count, has_more, next_offset, as_of, data, request_id]
      properties:
        schema_version: {type: string}
        report:
          type: string
          not: {enum: [out_schedule, departures]}
        source: {type: string}
        filters: {type: object, additionalProperties: {type: string}}
        sort: {type: array, items: {type: string}}
        offset: {type: integer}
        limit: {type: integer}
        count: {type: integer, description: "Compatibility alias for page_count; never the full total."}
        page_count: {type: integer}
        total_count: {type: integer}
        has_more: {type: boolean}
        next_offset: {type: [integer, 'null']}
        sensitive_fields_included: {type: boolean}
        as_of: {type: string, format: date-time}
        source_freshness: {type: string}
        caveats: {type: array, items: {type: string}}
        data: {type: array, items: {type: object, additionalProperties: true}}
        request_id: {type: string, format: uuid}
    LegacyResponse:
      type: object
      additionalProperties: false
      required: [count, data]
      properties:
        count: {type: integer}
        data: {type: array, items: {type: object, additionalProperties: true}}
    CatalogResponse:
      type: object
      additionalProperties: true
      required: [schema_version, schema_verified_at, endpoint, method, authentication, principal, global_parameters, response_contract, guidance, reports]
      properties:
        schema_version: {type: string}
        schema_verified_at: {type: string, format: date-time}
        endpoint: {type: string, const: /functions/v1/agent-reporting}
        method: {type: string, const: GET}
        authentication: {type: string}
        principal: {type: object, additionalProperties: true}
        global_parameters: {type: object, additionalProperties: true}
        response_contract: {type: object, additionalProperties: true}
        guidance: {type: object, additionalProperties: true}
        metadata_required: {type: boolean, const: true, description: "Present only in compact discovery. Load full selected-report metadata before unfamiliar field/calculation use."}
        reports: {type: object, additionalProperties: true}
      if:
        required: [metadata_required]
      then:
        properties:
          reports:
            type: object
            additionalProperties:
              type: object
              additionalProperties: false
              required: [source, row_grain, filters, metadata_url]
              properties:
                source: {type: string}
                row_grain: {type: string}
                filters: {type: object, additionalProperties: {type: string}}
                required_anchor: {type: string}
                metadata_url: {type: string}
    MetadataResponse:
      type: object
      additionalProperties: true
      required: [schema_version, schema_verified_at, report, guidance, source]
      properties:
        schema_version: {type: string}
        schema_verified_at: {type: string, format: date-time}
        report: {type: string, enum: [settlement_summary, settlements, driver_pay, drivers, returns, trucks, fuel, outside_repairs, out_schedule, departures]}
        guidance: {type: object, additionalProperties: true}
        source: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        request_id: {type: string, format: uuid}
  responses:
    Invalid:
      description: Unknown report/filter, duplicate parameter, invalid value/range, or missing anchor.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, invalid, or expired credential.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Valid credential without report or sensitive-field permission.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
